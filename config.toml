# ─────────────────────────────────────────────────────────────────────────────
# Dreamer Config
# Edit this file to change training settings.
# Sim uses [common] + [sim]. Real uses [common] + [real].
# [real] and [sim] keys override [common] when they share a name.
# ─────────────────────────────────────────────────────────────────────────────

[common]

# ── Architecture ──────────────────────────────────────────────────────────────
embedding_size        = 1024
hidden_size           = 300
belief_size           = 200
state_size            = 30
action_size           = 2
cnn_act               = "relu"
dense_act             = "elu"

# ── World model ───────────────────────────────────────────────────────────────
free_nats             = 1.0
reward_scale          = 10
pcont                 = false
pcont_scale           = 10

# ── Training ──────────────────────────────────────────────────────────────────
seed_episodes         = 5
collect_interval      = 100
batch_size            = 50
chunk_size            = 50
world_lr              = 6e-4
actor_lr              = 8e-5
value_lr              = 8e-5
adam_epsilon          = 1e-7
grad_clip_norm        = 100.0
learning_rate_schedule = 0

# ── Policy ────────────────────────────────────────────────────────────────────
planning_horizon      = 15
discount              = 0.99
disclam               = 0.95
polyak                = 0.005
expl_amount           = 0.15
with_logprob          = false
auto_temp             = false
temp                  = 0.003
kl_balance            = true
symlog_rewards        = true
return_norm           = true

# ── DonkeyCar action constraints ─────────────────────────────────────────────
fix_speed             = true
throttle_base         = 0.3
throttle_min          = 0.1
throttle_max          = 0.5
angle_min             = -1.0
angle_max             = 1.0

# ── Observation ───────────────────────────────────────────────────────────────
grayscale             = false   # true → 1-channel, false → 3-channel RGB

# ── Reproducibility ───────────────────────────────────────────────────────────
seed                  = 42
disable_cuda          = false

# ── Smoothing ─────────────────────────────────────────────────────────────────
smooth_weight         = 0.0         # steering jitter penalty (0 = off)
smooth_window         = 10          # rolling window for std dev

# ── Experiment identity ───────────────────────────────────────────────────────
experiment_name       = ""          # tag appended to rewards CSV name; empty = timestamp

# ── Resume (leave empty to start fresh) ──────────────────────────────────────
models            = ""
experience_replay = ""


# ─────────────────────────────────────────────────────────────────────────────
[sim]
# ─────────────────────────────────────────────────────────────────────────────

env                   = "donkey-generated-track-v0"
episodes              = 1000
experience_size       = 1000000
max_episode_length    = 1000

# Simulator connection
sim_path              = "self"      # "self" = manually launched sim
host                  = "127.0.0.1"
port                  = 9091

# Human override (keyboard controls episode outcome)
human_override        = true
fix_speed             = false       # variable throttle [0.1, 0.5]

# Episode termination
max_cte               = 4.0
stuck_speed_threshold = 0.1
stuck_steps_limit     = 15

# Reward (human_override=true path only)
survival_bonus        = 0.5        # added to throttle each step when not terminated

# Augmentation
augment               = false
hflip                 = true

# Evaluation
test                  = false
test_interval         = 5
test_episodes         = 1

# Checkpointing
checkpoint_interval   = 500
checkpoint_experience = false


# ─────────────────────────────────────────────────────────────────────────────
[automated]
# train_sim_automated.py — headless ablation experiments, no keyboard needed
# ─────────────────────────────────────────────────────────────────────────────

env                   = "donkey-generated-track-v0"
episodes              = 20
experience_size       = 100000
max_episode_length    = 1000

sim_path              = "self"
host                  = "127.0.0.1"
port                  = 9091

augment               = false
experiment_name       = "baseline"   # overrides [common] empty default
seed                  = 1            # change per run: 1, 2, 3

# Ablation flags — inherited from [common]; add overrides here to flip ONE at a time
# kl_balance          = false
# symlog_rewards      = false
# return_norm         = false

# Evaluation
test_interval         = 5
test_episodes         = 1

# Checkpointing
checkpoint_interval   = 10
checkpoint_experience = false


# ─────────────────────────────────────────────────────────────────────────────
[real]
# train_real_server.py — runs on Mac/Linux
# ─────────────────────────────────────────────────────────────────────────────

episodes              = 500
experience_size       = 50000       # ~230 MB for RGB
results_dir           = "results/real"

# Augmentation on by default for sim-to-real transfer
augment               = true
hflip                 = true
expl_amount           = 0.0         # TFLite inference is deterministic

# Car communication
bind_ip               = "*"         # bind to all interfaces

# Model/checkpoint cadence
push_interval         = 1           # export + push TFLite every N episodes
checkpoint_interval   = 50
smooth_weight         = 0.1         # override: real car needs more smoothing than sim


# ─────────────────────────────────────────────────────────────────────────────
[pi]
# train_real_pi.py — runs on Pi5
# Edit server_ip before each session.
# ─────────────────────────────────────────────────────────────────────────────

server_ip             = "192.168.0.103"   # Mac IP — run `ipconfig getifaddr en0`
model                 = ""                # leave empty to auto-select from models/
max_episode_steps     = 1000              # auto-end episode after N steps (~8s at 60fps)
